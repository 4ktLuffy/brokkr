[package]
name = "brokkr-runner"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Runs one command against one repository inside a fresh Firecracker microVM"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
strip = true
